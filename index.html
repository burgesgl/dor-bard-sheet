<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dor">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Dor — Bard Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+SC:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Silverquill ink: a black-and-silver character sheet with gold rules, laid out like the printed sheet.
   Layout: framed banner header, sticky vitals strip, then 2 columns on iPad portrait, 3 on iPad landscape. */
:root{
  --ink:#0d0f13;
  --ink-2:#12151b;
  --panel:#171a21;
  --panel-2:#1f232c;
  --line:#2e3440;
  --silver:#dde1e8;
  --dim:#939aa7;
  --gold:#d9b15a;
  --gold-2:#a8853c;
  --gold-soft:rgba(217,177,90,.12);
  --good:#78c69d;
  --warn:#e3b95e;
  --bad:#e2766f;
  --display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --caps:"Cormorant SC", "Cormorant Garamond", Georgia, serif;
  --body:"IBM Plex Sans", -apple-system, system-ui, "Segoe UI", sans-serif;
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(1200px 600px at 50% -200px, rgba(217,177,90,.07), transparent 70%),
    radial-gradient(900px 900px at 100% 100%, rgba(120,140,170,.05), transparent 60%),
    var(--ink);
  background-attachment:fixed;
  color:var(--silver);font-family:var(--body);font-size:16px;line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
button,input,textarea,select{font:inherit;color:inherit}
button,label.btn{cursor:pointer;touch-action:manipulation}
input,textarea{font-size:16px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums lining-nums}
.hpnum,.ab .mod,.toast .tot,.vp .n,.log span.r{font-variant-numeric:lining-nums tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:1240px;margin:0 auto;padding:calc(8px + var(--safe-t)) calc(20px + var(--safe-r)) calc(140px + var(--safe-b)) calc(20px + var(--safe-l))}

/* ---------- banner header ---------- */
header.top{
  margin:12px 0 0;padding:18px 22px 16px;
  display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);border-radius:14px;position:relative;
  box-shadow:inset 0 0 0 5px var(--panel),inset 0 0 0 6px rgba(217,177,90,.28),0 12px 30px rgba(0,0,0,.35);
}
header.top::before,header.top::after{content:"";position:absolute;top:50%;width:9px;height:9px;background:var(--gold);transform:translateY(-50%) rotate(45deg)}
header.top::before{left:-5px}
header.top::after{right:-5px}
.namebox{min-width:0}
.namebox .eyebrow{font-family:var(--caps);letter-spacing:.18em;color:var(--gold);font-size:.85rem;font-weight:600}
.namebox h1{font-family:var(--display);font-size:2.6rem;line-height:1.02;font-style:italic;font-weight:600;color:#f1f3f7}
.namebox h1 .nick{color:var(--gold);font-style:normal;font-weight:500;font-size:.6em;margin-left:.35em;letter-spacing:.03em}
.subline{color:var(--dim);font-size:.95rem;margin-top:6px}
.subline b{color:var(--silver);font-weight:500}
.subline .sep{color:var(--gold-2);margin:0 .4em}
.topbtns{display:flex;gap:10px;flex-wrap:wrap}

.btn{min-height:44px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 16px;font-size:.92rem;font-weight:500;color:var(--silver)}
.btn.gold{background:var(--gold-soft);border-color:rgba(217,177,90,.7);color:var(--gold)}
.btn.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.btn.small{min-height:40px;padding:7px 12px;font-size:.85rem}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- sticky vitals ---------- */
.vitals{
  position:sticky;top:0;z-index:20;margin:14px calc(-20px - var(--safe-r)) 0 calc(-20px - var(--safe-l));
  padding:calc(10px + var(--safe-t)) calc(20px + var(--safe-r)) 10px calc(20px + var(--safe-l));
  background:rgba(13,15,19,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.vrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.vrow + .vrow{margin-top:8px}
.vrow.navrow{margin-top:4px}
.hpblock{flex:1 1 220px;min-width:200px}
.hpline{display:flex;align-items:baseline;gap:8px}
.hpnum{font-family:var(--display);font-size:2.3rem;font-weight:700;line-height:1;color:#f1f3f7}
.hpmax{color:var(--dim)}
.hptemp{color:var(--gold);font-size:.9rem}
.hpbar{height:7px;background:var(--panel-2);border-radius:5px;overflow:hidden;margin-top:6px;box-shadow:inset 0 0 0 1px var(--line)}
.hpbar i{display:block;height:100%;background:var(--good);transition:width .25s}
.hpctl{display:flex;gap:8px;align-items:center}
.hpctl input{width:76px;min-height:44px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.chips{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:1 1 100%;min-width:0}
.chips::-webkit-scrollbar,.jump::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:40px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:.82rem;color:var(--dim);display:flex;gap:7px;align-items:center}
.chip b{color:var(--silver);font-size:1.02rem;font-weight:600}
button.chip{border-color:rgba(217,177,90,.35)}
.advbar{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:0 0 auto}
.advbar button{min-height:44px;min-width:64px;background:var(--panel);border:0;padding:6px 12px;font-size:.82rem;font-weight:600;color:var(--dim)}
.advbar button + button{border-left:1px solid var(--line)}
.advbar button.on{background:var(--gold);color:var(--ink)}
.jump{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;align-items:center;flex:1 1 360px;min-width:0}
.jump a{color:var(--dim);text-decoration:none;font-family:var(--caps);font-size:1rem;letter-spacing:.06em;padding:6px 10px;border-radius:8px;white-space:nowrap;min-height:36px;display:flex;align-items:center}
.sync{font-size:.76rem;color:var(--dim);white-space:nowrap;padding:0 4px;margin-left:auto}

/* ---------- framed cards ---------- */
.grid{display:grid;grid-template-columns:1fr;gap:18px;margin-top:18px}
@media (min-width:700px){.grid{grid-template-columns:1fr 1fr}}
@media (min-width:700px) and (max-width:1099px){#skills{grid-row:span 2}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(3,1fr);grid-auto-flow:row dense}}
.card{
  position:relative;background:linear-gradient(180deg,var(--panel),var(--ink-2));
  border:1px solid var(--line);border-radius:14px;padding:16px 16px 18px;scroll-margin-top:190px;
  box-shadow:inset 0 0 0 4px var(--ink-2),inset 0 0 0 5px rgba(217,177,90,.16),0 10px 24px rgba(0,0,0,.28);
  min-width:0;
}
.card > header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 4px 14px;padding-bottom:10px;position:relative;border-bottom:1px solid rgba(217,177,90,.28)}
.card > header::after{content:"";position:absolute;left:50%;bottom:-5px;width:9px;height:9px;background:var(--ink-2);border:1px solid rgba(217,177,90,.6);transform:translateX(-50%) rotate(45deg)}
.card h2{font-family:var(--caps);font-size:1.5rem;font-weight:600;letter-spacing:.08em;color:#eef0f4}
.card h3{font-family:var(--caps);font-size:1.15rem;font-weight:600;letter-spacing:.07em}
.card .hint{color:var(--dim);font-size:.8rem;text-align:right}
.span2{grid-column:1/-1}
@media (min-width:1100px){.span2{grid-column:span 2}}
.full{grid-column:1/-1}

/* abilities: like the sheet's tall boxes with an oval score */
.abil{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding-bottom:6px}
.ab{position:relative;background:var(--panel-2);border:1px solid var(--line);border-radius:12px 12px 22px 22px;padding:10px 6px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:inset 0 0 0 3px var(--panel-2),inset 0 0 0 4px rgba(255,255,255,.04)}
.ab .lbl{font-family:var(--caps);font-size:.86rem;letter-spacing:.14em;color:var(--dim);font-weight:600}
.ab .mod{font-family:var(--display);font-size:2.4rem;font-weight:700;line-height:1;background:none;border:0;padding:4px 10px;min-height:48px;color:#f1f3f7}
.ab .score{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);min-width:48px;padding:2px 10px;border-radius:999px;background:var(--ink);border:1px solid rgba(217,177,90,.55);font-weight:600;font-size:.9rem;color:var(--silver)}
.ab input.score{width:64px;text-align:center}
.ab .save{margin-top:4px;min-height:36px;font-size:.8rem;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 8px;color:var(--dim);width:calc(100% - 8px)}
.ab .save.prof{color:var(--gold);border-color:rgba(217,177,90,.5)}

/* skills */
.skills{display:flex;flex-direction:column}
.sk{display:flex;align-items:center;gap:10px;padding:4px 2px;border-bottom:1px solid rgba(46,52,64,.6);min-height:46px}
.sk:last-child{border-bottom:0}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--dim);flex:0 0 auto}
.dot.p{background:var(--gold);border-color:var(--gold)}
.dot.e{background:var(--gold);border-color:var(--silver);box-shadow:0 0 0 2px var(--gold)}
.dot.j{border-style:dashed}
button.dot{padding:0;width:28px;height:28px;background-clip:content-box;border-width:7px;border-color:transparent;box-shadow:inset 0 0 0 1.5px var(--dim);border-radius:50%}
button.dot.p,button.dot.e{background-color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold)}
.sk .nm{flex:1}
.sk .ab3{color:var(--dim);font-family:var(--caps);font-size:.85rem;letter-spacing:.08em;width:36px}
.rollbtn{min-height:40px;min-width:52px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:4px 10px;font-weight:600;color:var(--silver)}
.notice{background:var(--gold-soft);border:1px solid rgba(217,177,90,.45);border-left:3px solid var(--gold);border-radius:8px;padding:9px 12px;font-size:.88rem;margin-bottom:12px}
.notice b{color:var(--gold)}

/* resources */
.res{display:flex;flex-direction:column;gap:14px}
.resrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.resrow .t{font-weight:500}
.resrow .s{color:var(--dim);font-size:.82rem}
.pips{display:flex;gap:8px}
.pip{width:30px;height:30px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 35% 35%,#f0cf86,var(--gold) 55%,var(--gold-2));padding:0}
.pip.used{background:transparent;border-color:var(--line)}
.pip.bad{border-color:var(--bad);background:transparent}
.pip.bad.used{background:var(--bad);border-color:var(--bad)}
.pip.good{border-color:var(--good);background:transparent}
.pip.good.used{background:var(--good)}

/* attacks + spells */
.atk{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(46,52,64,.6)}
.atk:last-child{border-bottom:0}
.atk .nm{font-weight:600}
.atk .sub{color:var(--dim);font-size:.8rem}
.spgroup{min-width:0}
.sphead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px dashed rgba(217,177,90,.25)}
.sphead h3{color:var(--gold)}
.sp{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid rgba(217,177,90,.45);border-radius:10px;padding:11px 12px;margin-bottom:10px}
.sp .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sp .nm{font-family:var(--display);font-weight:700;font-size:1.25rem;color:#f1f3f7}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--dim);background:var(--ink-2)}
.tag.c{color:var(--warn);border-color:rgba(227,185,94,.5)}
.tag.src{color:var(--gold);border-color:rgba(217,177,90,.45)}
.sp p{margin:8px 0 0;font-size:.9rem;color:#bfc4ce;max-width:65ch}
.sp .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.locked{opacity:.6}

/* text */
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field .k{font-family:var(--caps);font-size:.95rem;letter-spacing:.1em;color:var(--gold);font-weight:600;margin-bottom:3px}
.field .v{white-space:pre-wrap;max-width:65ch;color:#d3d7df}
textarea,.ti{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;resize:vertical}
.look{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
@media (min-width:900px){.look{grid-template-columns:repeat(6,1fr)}}
.look div{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.look .k{font-family:var(--caps);font-size:.82rem;letter-spacing:.1em;color:var(--dim);font-weight:600}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(46,52,64,.6);min-height:40px}
.li:last-child{border-bottom:0}
.coins{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.coin{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:6px 4px;text-align:center}
.coin .k{font-family:var(--caps);font-size:.85rem;color:var(--gold);font-weight:600;letter-spacing:.08em}
.coin input{width:100%;background:transparent;border:0;text-align:center;font-weight:600;font-size:1.05rem;padding:0;min-height:30px}
.feat{padding:9px 0;border-bottom:1px solid rgba(46,52,64,.6)}
.feat:last-child{border-bottom:0}
.feat b{font-family:var(--display);font-size:1.15rem;font-weight:700;color:#f1f3f7}
.feat .src{color:var(--gold-2);font-family:var(--caps);font-size:.85rem;letter-spacing:.06em;margin-left:8px}
.feat p{margin:3px 0 0;font-size:.9rem;color:#bfc4ce}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-height:44px;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.x{background:none;border:0;color:var(--bad);font-size:1.3rem;min-width:40px;min-height:40px;padding:0}

/* campaign */
.maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.maps figure{margin:0;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(217,177,90,.12)}
.maps button{display:block;width:100%;padding:0;border:0;background:none}
.maps img{display:block;width:100%;height:auto}
.maps figcaption{padding:9px 12px;font-size:.88rem;color:var(--dim);border-top:1px solid var(--line)}
.maps figcaption b{color:var(--silver);font-family:var(--display);font-size:1.1rem;font-weight:700}
.vps{display:flex;flex-direction:column;gap:6px}
.vp{display:flex;align-items:center;gap:10px}
.vp .who{flex:1;font-weight:500}
.vp .n{min-width:30px;text-align:center;font-family:var(--display);font-weight:700;font-size:1.5rem;color:var(--gold)}
.viewer{position:fixed;inset:0;background:rgba(8,9,12,.97);z-index:60;display:flex;flex-direction:column;padding:calc(12px + var(--safe-t)) calc(12px + var(--safe-r)) calc(12px + var(--safe-b)) calc(12px + var(--safe-l));gap:10px}
.viewer[hidden]{display:none}
.viewer .btn{align-self:flex-end}
.vscroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
.vscroll img{display:block;width:170%;max-width:none;height:auto}
@media (min-width:1100px){.vscroll img{width:125%}}

/* roll toast + log */
.toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translateX(-50%) translateY(160%);background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--gold);border-radius:16px;padding:12px 20px;min-width:280px;max-width:calc(100% - 40px);box-shadow:inset 0 0 0 4px var(--panel),inset 0 0 0 5px rgba(217,177,90,.25),0 14px 34px rgba(0,0,0,.55);transition:transform .2s;z-index:50;display:flex;gap:16px;align-items:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast .tot{font-family:var(--display);font-size:2.8rem;font-weight:700;line-height:1;color:var(--gold);min-width:52px;text-align:center}
.toast .tot.crit{color:var(--good)}
.toast .tot.fumble{color:var(--bad)}
.toast .lab{font-weight:600;font-size:1.02rem}
.toast .br{color:var(--dim);font-size:.84rem}
.log{display:flex;flex-direction:column;gap:2px;font-size:.88rem;max-height:260px;overflow:auto}
.log div{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid rgba(46,52,64,.5)}
.log span.r{font-family:var(--display);font-weight:700;font-size:1.2rem;color:var(--gold)}

.notes-area{width:100%;min-height:260px;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;line-height:1.6;resize:vertical;
  background-image:repeating-linear-gradient(transparent 0 calc(1.6em - 1px), rgba(217,177,90,.10) calc(1.6em - 1px) 1.6em);background-position:0 12px;background-attachment:local}
.levelup{border-color:rgba(217,177,90,.6);box-shadow:inset 0 0 0 4px var(--ink-2),inset 0 0 0 5px rgba(217,177,90,.45),0 10px 30px rgba(217,177,90,.08)}
.lu-items{display:flex;flex-direction:column;gap:18px}
.lu-item h3{color:var(--gold);margin-bottom:4px}
.lu-item > p{margin:0 0 10px;color:#c6cad3;font-size:.92rem;max-width:70ch}
.lu-list{margin:4px 0 10px;padding-left:20px;color:#d3d7df}
.lu-list li{margin:3px 0}
.lu-opts{display:flex;gap:8px;flex-wrap:wrap}
.lu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.lu-card{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-left:3px solid rgba(217,177,90,.5);border-radius:10px;padding:10px 12px;min-height:44px}
.lu-name{font-family:var(--display);font-weight:700;font-size:1.15rem;color:#f1f3f7}
.lu-src{font-family:var(--caps);font-size:.82rem;letter-spacing:.06em;color:var(--gold-2)}
.lu-desc{font-size:.86rem;color:#bfc4ce}
.lu-chips{display:flex;gap:8px;flex-wrap:wrap}
.lu-chip{min-height:44px;background:var(--panel-2);border:1px solid rgba(217,177,90,.4);border-radius:22px;padding:6px 14px;font-weight:500}
.lu-chip span{color:var(--dim);font-size:.8rem;margin-left:4px}
.lu-more{margin-top:10px}
.lu-more summary{list-style:none}
.lu-more summary::-webkit-details-marker{display:none}
.lu-more summary::before{content:"▸";margin-right:8px;transition:transform .15s;display:inline-block}
.lu-more[open] summary::before{transform:rotate(90deg)}
.lu-more summary{cursor:pointer;font-family:var(--caps);letter-spacing:.06em;font-size:1.05rem;color:var(--gold);min-height:40px;display:flex;align-items:center}
.lu-list2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:6px}
.lu-row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.lu-row b{font-family:var(--display);font-size:1.12rem;color:#f1f3f7}
.lu-row p{margin:5px 0 0;font-size:.85rem;color:#bfc4ce}
.edit-only{display:none}
body.editing .edit-only{display:revert}
body.editing .view-only{display:none}
@media (hover:hover){
  .btn:hover,.rollbtn:hover,button.chip:hover,.ab .save:hover{border-color:var(--gold)}
  .ab .mod:hover{color:var(--gold)}

function fill(st){ const D=JSON.parse(JSON.stringify(DEFAULT));
  for(const k in D){ if(st[k]===undefined) st[k]=D[k]; }
  for(const k in D.text){ if(st.text[k]===undefined) st.text[k]=D.text[k]; }
  if(st.hpLevel===undefined) st.hpLevel=st.level;
  if(st.seen===undefined) st.seen=st.level;
  if(st.college===undefined) st.college=null;
  if(!st.asi) st.asi={};
  if(!st.feats) st.feats=[];
  return st; }
fill(S);
let editing = false, adv = 0;
let dbRef = null, lastSent = null, writing = false, queued = false, saveTimer = null, syncState = "local";

function save(){
  try{ localStorage.setItem(LSKEY, JSON.stringify(S)); }catch(e){}
  if(!dbRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushDb, 700);
}
async function pushDb(){
  if(writing){ queued = true; return; }
  const json = JSON.stringify(S);
  if(json===lastSent) return;
  writing = true;
  try{ await dbRef.set({json, at:new Date().toISOString()}); lastSent = json; syncState="saved"; }
  catch(e){ syncState = (e && e.code==="invalid_argument") ? "readonly" : "local"; }
  writing = false; renderSync();
  if(queued){ queued=false; pushDb(); }
}
(async ()=>{
  try{
    if(!window.claude || !window.claude.use) return;
    const db = await window.claude.use("db");
    if(!db) return;
    dbRef = db.doc("sheet/main");
    let gotFirst = false;
    const t = setTimeout(()=>{ if(!gotFirst){ syncState="offline"; renderSync(); } }, 10000);
    dbRef.onSnapshot(snap=>{
      if(snap.metadata && snap.metadata.hasPendingWrites) return;
      if(!snap.metadata || !snap.metadata.fromCache){ gotFirst = true; clearTimeout(t); }
      if(snap.exists){
        const d = snap.data();
        if(d && typeof d.json==="string" && d.json!==lastSent && d.json!==JSON.stringify(S)){
          try{ const n = JSON.parse(d.json); if(n && n.v===1){ S = fill(n); lastSent = d.json; try{localStorage.setItem(LSKEY,d.json);}catch(e){} renderAll(); } }catch(e){}
        } else if(d && d.json) lastSent = d.json;
        syncState="saved";
      } else {
        syncState="saved"; pushDb();
      }
      renderSync();
    }, ()=>{ clearTimeout(t); syncState="local"; renderSync(); });
  }catch(e){}
})();

/* ---------- math ---------- */
const mod = s => Math.floor((s-10)/2);
const sgn = n => (n>=0?"+":"")+n;
const pb = () => Math.ceil(S.level/4)+1;
const jack = () => S.level>=2 ? Math.floor(pb()/2) : 0;
const M = k => mod(S.abil[k]);
function skillBonus(key, ab){
  const p = S.skillProf[key]||0;
  return M(ab) + (p===2 ? 2*pb() : p===1 ? pb() : jack());
}
const initBonus = () => M("dex") + jack() + ((S.feats||[]).some(f=>f.name==="Alert")?5:0);
const cantripDice = (expr, lvl) => { if(lvl!==0||!expr) return expr; const t=S.level>=17?4:S.level>=11?3:S.level>=5?2:1; const m=/^(\d+)d(\d+)$/.exec(expr); return m?`${+m[1]*t}d${m[2]}`:expr; };
const saveBonus = k => M(k) + (S.saveProf.includes(k)?pb():0);
const dc = () => 8 + pb() + M("cha");
const spellAtk = () => pb() + M("cha");
const biDie = () => S.level>=15?12:S.level>=10?10:S.level>=5?8:6;
const biMax = () => Math.max(1, M("cha"));
const restDie = () => S.level>=17?12:S.level>=13?10:S.level>=9?8:6;
const slotsFor = l => (SLOTS[Math.min(S.level,10)]||[])[l-1]||0;
const passive = () => 10 + skillBonus("perception","wis");
const profCount = () => Object.values(S.skillProf).filter(v=>v>=1).length;

/* ---------- dice ---------- */
const d = n => 1+Math.floor(Math.random()*n);
function rollExpr(expr){ // "2d8", "1d4"
  const m = /^(\d+)d(\d+)$/.exec(expr); if(!m) return {total:0,rolls:[]};
  const rolls=[]; for(let i=0;i<+m[1];i++) rolls.push(d(+m[2]));
  return {total:rolls.reduce((a,b)=>a+b,0), rolls};
}
function d20(label, bonus){
  const a=d(20), b=d(20); let used=a, note="";
  if(adv===1){ used=Math.max(a,b); note=` (adv: ${a}, ${b})`; }
  if(adv===-1){ used=Math.min(a,b); note=` (dis: ${a}, ${b})`; }
  const total = used+bonus;
  const cls = used===20?"crit":used===1?"fumble":"";
  show(label, total, `d20 ${used} ${bonus>=0?"+":"−"} ${Math.abs(bonus)}${note}`, cls);
  adv=0; renderVitals();
}
function dmg(label, expr, flat, type, crit){
  let r = rollExpr(expr), extra = crit ? rollExpr(expr) : {total:0,rolls:[]};
  const total = Math.max(0, r.total + extra.total + (flat||0));
  const rolls = r.rolls.concat(extra.rolls);
  show(label, total, `${crit?"CRIT ":""}${expr}${crit?"×2":""} [${rolls.join(", ")}]${flat?(flat>0?" + ":" − ")+Math.abs(flat):""}${type?" "+type:""}`, crit?"crit":"");
  return total;
}
let toastT;
function show(label,total,br,cls){
  const t=document.getElementById("toast");
  t.innerHTML=`<div class="tot ${cls||""} num">${total}</div><div><div class="lab">${esc(label)}</div><div class="br num">${esc(br)}</div></div>`;
  t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),4200);
  S.log = [{l:label,t:total,b:br,at:Date.now()}].concat(S.log||[]).slice(0,25);
  save(); renderRolls();
}
function note(label, br){ // non-roll message
  const t=document.getElementById("toast");
  t.innerHTML=`<div><div class="lab">${esc(label)}</div>${br?`<div class="br">${esc(br)}</div>`:""}</div>`;
  t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),3200);
}
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function pips(n, used, act, cls){
  let h=""; for(let i=0;i<n;i++) h+=`<button class="pip ${cls||""} ${i<used?"used":""}" data-act="${act}" data-i="${i}" aria-label="${act} ${i+1}"></button>`;
  return `<div class="pips">${h}</div>`;
}

  }

function spellCard(s,i){
  const tags = [s.cast, s.range, s.dur, s.save?`${s.save} save DC ${dc()}`:"", s.dmg?`${cantripDice(s.dmg,s.lvl)} ${s.dtype}`:"", s.heal?`${s.heal}${sgn(M("cha"))} heal`:""].filter(Boolean);
  const lockedLvl = s.lvl>0 && !slotsFor(s.lvl);
  const acts = [];
  if(s.lvl>0 && !lockedLvl) acts.push(`<button class="btn small gold" data-act="cast:${i}">Cast (use ${ORD[s.lvl]} slot)</button>`);
  if(s.free) acts.push(`<button class="btn small" data-act="castfree:${i}" ${S.freeDWUsed?"disabled":""}>Cast free</button>`);
  if(s.dmg) acts.push(`<button class="btn small" data-roll="sdmg:${i}">Roll ${esc(cantripDice(s.dmg,s.lvl))}</button>`);
  if(s.heal) acts.push(`<button class="btn small" data-roll="sheal:${i}">Roll ${esc(s.heal)}${sgn(M("cha"))}</button>`);
  return `<div class="sp ${lockedLvl?"locked":""}">
    <div class="top"><div><span class="nm">${esc(s.name)}</span>
      <div class="tags">${s.src?`<span class="tag src">${esc(s.src)}</span>`:""}${s.conc?`<span class="tag c">Concentration</span>`:""}${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div></div>
      ${editing?`<button class="x" data-act="delspell:${i}" aria-label="Remove ${esc(s.name)}">×</button>`:""}</div>
    <p>${esc(s.desc)}</p>
    ${acts.length?`<div class="acts">${acts.join("")}</div>`:""}
  </div>`;
}

  <div class="list">${S.equipment.map((e,i)=>`<div class="li"><span>${esc(e.name)}</span>
    <span style="display:flex;gap:4px;align-items:center">${editing?`<input class="ti num" type="number" min="0" data-eq="${i}" value="${e.qty}" style="width:56px;padding:2px 4px"><button class="x" data-act="deleq:${i}" aria-label="Remove ${esc(e.name)}">×</button>`:`<span class="num hint">×${e.qty}</span>`}</span></div>`).join("")}</div>
  <div class="addrow"><input id="newItem" placeholder="Add an item"><button class="btn small" data-act="addeq">Add</button></div>

}

function textField(k,label,rows){

}
function renderProfs(){

  <div class="field"><div class="k">Saving throws</div><div class="v">Dexterity, Charisma</div></div>

}
function renderStory(){

  </div>`;
}

function renderCampaign(){
  document.getElementById("campaign").innerHTML = `<header><h2>Campaign</h2><span class="hint">Tap a map to zoom</span></header>
  <div class="grid" style="margin-top:0;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
    <div class="maps">
      <figure><button data-act="map:krillton" aria-label="Open Krillton map"><img src="${MAPS.krillton}" alt="Map of Krillton with your notes"></button><figcaption><b>Krillton</b> · where we start</figcaption></figure>
      <figure><button data-act="map:enora" aria-label="Open Enora map"><img src="${MAPS.enora}" alt="Map of Enora with your notes"></button><figcaption><b>Enora</b> · Sanguine is the far southeast tip</figcaption></figure>
    </div>
    <div>
      ${textField("campaign","Notes",7)}
      <div class="field"><div class="k">VPs</div>
        <div class="vps">${S.vps.map((v,i)=>`<div class="vp"><span class="who">${esc(v.who)}</span>
          <button class="rollbtn" data-act="vp:${i}:-1" aria-label="Subtract a VP from ${esc(v.who)}">−</button>
          <span class="n num">${v.n}</span>
          <button class="rollbtn" data-act="vp:${i}:1" aria-label="Add a VP to ${esc(v.who)}">+</button></div>`).join("")}</div>
      </div>
    </div>
  </div>`;
}
/* ---------- level-up panel ---------- */
const maxSpellLvl = () => { let m=0; for(let l=1;l<=9;l++) if(slotsFor(l)) m=l; return m; };
const bardSpellsKnown = () => S.spells.filter(s=>s.src==="Bard" && s.lvl>0).length;
const bardCantripsKnown = () => S.spells.filter(s=>s.src==="Bard" && s.lvl===0).length;
const expertiseCount = () => Object.values(S.skillProf).filter(v=>v===2).length;
const expertiseNeed = () => S.level>=10?4:S.level>=3?2:0;
const skillNeed = () => 7 + (S.college==="Lore"?3:0);
const ordinal = n => ORD[n]||(n+"th level");
let luOpen = {};
function renderLevelUp(){
  const el=document.getElementById("levelup");
  const items=[];
  // what's new
  if(S.seen < S.level){
    const lines=[]; for(let l=S.seen+1;l<=S.level;l++) (LEVEL_INFO[l]||[]).forEach(t=>lines.push(`<li>${S.level-S.seen>1?`<b>Level ${l}:</b> `:""}${esc(t)}</li>`));
    if(S.level>S.seen) lines.push(`<li>You can also swap one bard spell you know for another bard spell. Remove it in Edit, then add the new one below.</li>`);
    items.push(`<div class="lu-item"><h3>New at level ${S.level}</h3><ul class="lu-list">${lines.join("")}</ul><button class="btn small" data-act="lu-seen">Got it</button></div>`);
  }
  // HP
  if(S.level > S.hpLevel){
    const next=S.hpLevel+1;
    items.push(`<div class="lu-item"><h3>Hit points for level ${next}</h3><p>Take the average (+${5+M("con")}) or roll a d8${sgn(M("con"))}.</p>
      <div class="lu-opts"><button class="btn gold small" data-act="lu-hp:avg">Take +${5+M("con")}</button><button class="btn small" data-act="lu-hp:roll">Roll d8${sgn(M("con"))}</button></div></div>`);
  }
  // college
  if(S.level>=3 && !S.college){
    const card=(k,c)=>`<button class="lu-card" data-act="lu-college:${k}"><span class="lu-name">College of ${k}</span><span class="lu-src">${esc(c.src)}</span><span class="lu-desc">${esc(c.blurb)}</span></button>`;
    const phb=Object.entries(COLLEGES).filter(([k,c])=>c.src==="PHB"), other=Object.entries(COLLEGES).filter(([k,c])=>c.src!=="PHB");
    items.push(`<div class="lu-item"><h3>Choose your Bard College</h3><p>Your campaign uses the Player's Handbook, which has Lore and Valor. The others need your DM's OK, like Silverquill did.</p>
      <div class="lu-grid">${phb.map(([k,c])=>card(k,c)).join("")}</div>
      <details class="lu-more"><summary>Colleges from other books</summary><div class="lu-grid">${other.map(([k,c])=>card(k,c)).join("")}</div></details></div>`);
  }
  // skills (Lore adds 3)
  if(S.college==="Lore" && profCount()<skillNeed()){
    items.push(`<div class="lu-item"><h3>${skillNeed()-profCount()} skill picks from College of Lore</h3><p>Tap any skill you aren't proficient in yet.</p>
      <div class="lu-chips">${SKILLS.filter(([k])=>!S.skillProf[k]).map(([k,n,a])=>`<button class="lu-chip" data-act="lu-prof:${k}">${n} <span>${a.toUpperCase()}</span></button>`).join("")}</div></div>`);
  }
  // expertise
  if(expertiseCount()<expertiseNeed()){
    const pool=SKILLS.filter(([k])=>S.skillProf[k]===1);
    items.push(`<div class="lu-item"><h3>${expertiseNeed()-expertiseCount()} Expertise pick${expertiseNeed()-expertiseCount()===1?"":"s"}</h3><p>Double your proficiency bonus in a skill you're already proficient in. CHA skills get the most out of it for Dor.</p>
      <div class="lu-chips">${pool.map(([k,n,a])=>`<button class="lu-chip" data-act="lu-exp:${k}">${n} <span>${sgn(skillBonus(k,a))} → ${sgn(skillBonus(k,a)+pb())}</span></button>`).join("")}</div></div>`);
  }
  // cantrips
  const cNeed = BARD_CANTRIPS[Math.min(S.level,20)] - bardCantripsKnown();
  if(cNeed>0){
    const known=new Set(S.spells.map(s=>s.name));
    items.push(`<div class="lu-item"><h3>${cNeed} new cantrip${cNeed>1?"s":""}</h3>
      <div class="lu-list2">${SPELL_OPTS.map((o,i)=>[o,i]).filter(([o])=>o[1]===0 && !known.has(o[0])).map(([o,i])=>optRow(o,i)).join("")}</div></div>`);
  }
  // spells known
  const sNeed = BARD_SPELLS_KNOWN[Math.min(S.level,20)] - bardSpellsKnown();
  if(sNeed>0){
    const known=new Set(S.spells.filter(s=>s.src!=="Planned").map(s=>s.name)), top=maxSpellLvl();
    const bardList=new Set(SPELL_OPTS.map(o=>o[0]));
    const planned=S.spells.map((s,i)=>[s,i]).filter(([s])=>s.src==="Planned" && s.lvl<=top && bardList.has(s.name));
    let groups="";
    for(let l=top;l>=1;l--){
      const opts=SPELL_OPTS.map((o,i)=>[o,i]).filter(([o])=>o[1]===l && !known.has(o[0]));
      if(!opts.length) continue;
      groups+=`<details class="lu-more" ${l===top?"open":""}><summary>${ordinal(l)} spells</summary><div class="lu-list2">${opts.map(([o,i])=>optRow(o,i)).join("")}</div></details>`;
    }
    items.push(`<div class="lu-item"><h3>${sNeed} new spell${sNeed>1?"s":""} to learn</h3><p>Any bard spell of ${ordinal(top).toLowerCase()} or lower.</p>
      ${planned.length?`<div class="lu-opts" style="margin-bottom:8px">${planned.map(([s,i])=>`<button class="btn gold small" data-act="lu-plan:${i}">Learn ${esc(s.name)} (planned)</button>`).join("")}</div>`:""}
      ${groups}</div>`);
  }
  // ASI / feat
  [4,8,12,16,19].filter(L=>S.level>=L && !S.asi[L]).forEach(L=>{
    const opts=[["cha2",`+2 CHA (${S.abil.cha}→${Math.min(20,S.abil.cha+2)})`,"Spell DC, spell attack, and Bardic Inspiration uses all go up."],
      ["chadex",`+1 CHA, +1 DEX`,`DEX ${S.abil.dex}→${S.abil.dex+1}${(S.abil.dex+1)%2===0?" (+1 AC, attacks, initiative)":""}.`],
      ["chacon",`+1 CHA, +1 CON`,`CON ${S.abil.con}→${S.abil.con+1}${(S.abil.con+1)%2===0?" (+1 HP per level, concentration)":""}.`]];
    items.push(`<div class="lu-item"><h3>Level ${L}: Ability Score Improvement or feat</h3><p>CHA ${S.abil.cha}${S.abil.cha%2?" is odd, so a +1 CHA feat like Actor rounds it up":""}.</p>
      <div class="lu-grid">${opts.map(([k,n,d])=>`<button class="lu-card" data-act="lu-asi:${L}:${k}"><span class="lu-name">${n}</span><span class="lu-desc">${esc(d)}</span></button>`).join("")}</div>
      <details class="lu-more"><summary>Take a feat instead</summary><div class="lu-grid">${FEATS.map(([n,d],i)=>`<button class="lu-card" data-act="lu-feat:${L}:${i}"><span class="lu-name">${n}</span><span class="lu-desc">${esc(d)}</span></button>`).join("")}</div></details></div>`);
  });
  el.hidden = !items.length;
  if(!items.length){ el.innerHTML=""; return; }
  el.innerHTML = `<header><h2>Level up</h2><span class="hint">Shows up when a new level leaves something to choose</span></header><div class="lu-items">${items.join("")}</div>`;
}
function optRow(o,i){
  const [n,l,cast,range,dur,conc,save,dm,dt,desc]=o;
  const tags=[cast,range,dur,save?`${save} save`:"",dm?`${dm} ${dt}`:""].filter(Boolean);
  return `<div class="lu-row"><div><b>${esc(n)}</b>${conc?` <span class="tag c">Concentration</span>`:""}<div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div><p>${esc(desc)}</p></div><button class="btn small gold" data-act="lu-learn:${i}">Learn</button></div>`;
}
function luAction(a,arg,arg2){
  if(a==="lu-seen"){ S.seen=S.level; }
  else if(a==="lu-hp"){ const c=M("con"); let gain;
    if(arg==="avg") gain=5+c; else { const r=d(8); gain=Math.max(1,r+c); show(`Level ${S.hpLevel+1} HP`, gain, `d8 ${r} ${sgn(c)}`, ""); }
    S.hpMax+=gain; S.hp+=gain; S.hpLevel++; if(arg==="avg") note(`+${gain} max HP`, `Now ${S.hpMax}`); }
  else if(a==="lu-uncollege"){ const c=S.college; S.college=null; note(`College of ${c} removed`, "Pick again in the Level up panel."); }
  else if(a==="lu-college"){ S.college=arg; note(`College of ${arg}`, "Its features are in your Features list."); }
  else if(a==="lu-prof"){ S.skillProf[arg]=1; }
  else if(a==="lu-exp"){ S.skillProf[arg]=2; }
  else if(a==="lu-plan"){ const s=S.spells[+arg]; s.src="Bard"; note(`Learned ${s.name}`); }
  else if(a==="lu-learn"){ const [n,l,cast,range,dur,conc,save,dm,dt,desc]=SPELL_OPTS[+arg];
    const sp={name:n,lvl:l,src:"Bard",cast,range,dur,desc}; if(conc) sp.conc=true; if(save) sp.save=save; if(dm){ sp.dmg=dm; sp.dtype=dt; }
    if(n==="Cure Wounds"){ sp.heal="1d8"; sp.healMod=true; }
    S.spells.push(sp); note(`Learned ${n}`); }
  else if(a==="lu-asi"){ const L=+arg;
    if(arg2==="cha2") S.abil.cha=Math.min(20,S.abil.cha+2);
    if(arg2==="chadex"){ S.abil.cha=Math.min(20,S.abil.cha+1); S.abil.dex=Math.min(20,S.abil.dex+1); }
    if(arg2==="chacon"){ S.abil.cha=Math.min(20,S.abil.cha+1); S.abil.con=Math.min(20,S.abil.con+1); }
    S.asi[L]=arg2; note("Ability scores updated"); }
  else if(a==="lu-feat"){ const L=+arg, [n,desc]=FEATS[+arg2];
    S.feats.push({name:n,desc,lvl:L}); S.asi[L]="feat:"+n;
    if(n==="Actor") S.abil.cha=Math.min(20,S.abil.cha+1);
    if(n==="Resilient (CON)"){ S.abil.con=Math.min(20,S.abil.con+1); if(!S.saveProf.includes("con")) S.saveProf.push("con"); }
    if(n==="Mobile") S.speed+=10;
    if(n==="Tough"){ S.hpMax+=2*S.level; S.hp+=2*S.level; }
    note(`Took ${n}`, n==="Observant"?"Bump INT or WIS by 1 in Edit.":""); }
  else return false;
  save(); renderAll(); return true;
}

let notesTimer;
function renderNotes(){
  const el=document.getElementById("notes");
  if(document.activeElement && document.activeElement.id==="notesArea") return;
  el.innerHTML = `<header><h2>Notes</h2><span class="hint">Saves as you type</span></header>
  <textarea id="notesArea" class="notes-area" aria-label="Session notes" placeholder="NPCs, clues, loot, who owes who…">${esc(S.notes||"")}</textarea>`;
}
document.addEventListener("input", e=>{
  if(e.target.id!=="notesArea") return;
  S.notes = e.target.value; clearTimeout(notesTimer); notesTimer=setTimeout(save,600);
});
function renderRolls(){
  const el = document.getElementById("rolls"); if(!el) return;
  const log = S.log||[];
  el.innerHTML = `<header><h2>Roll log</h2>${log.length?`<button class="btn small" data-act="clearlog">Clear</button>`:""}</header>
  <div class="log">${log.length?log.map(r=>`<div><span>${esc(r.l)} <span class="hint num">${esc(r.b)}</span></span><span class="r num">${r.t}</span></div>`).join(""):`<span class="hint">Rolls show up here.</span>`}</div>`;
}
const IN_CLAUDE = !!(window.claude && window.claude.use);
function renderBackup(){
  let last = ""; try{ last = localStorage.getItem(LSKEY+"-exported")||""; }catch(e){}
  document.getElementById("backup").innerHTML = `<header><h2>Save file</h2></header>
  <p class="hint" style="margin:0 0 10px">${IN_CLAUDE
    ? "This copy saves to your Claude account. Load a file here to bring in progress from the GitHub version."
    : "This page saves in this browser automatically. Save a file to your computer to back it up or move Dor to another device."}</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    ${IN_CLAUDE?"":`<button class="btn gold" data-act="export">Save to file</button>`}
    <label class="btn" for="importFile" style="display:inline-flex;align-items:center">Load file</label>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
  </div>
  ${last&&!IN_CLAUDE?`<p class="hint" style="margin:8px 0 0">Last saved to file: ${esc(last)}</p>`:""}`;
}
function exportFile(){
  const blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const d = new Date(), stamp = d.toISOString().slice(0,10);
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `dor-sheet-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  try{ localStorage.setItem(LSKEY+"-exported", d.toLocaleString()); }catch(e){}
  renderBackup(); note("Saved to file", `dor-sheet-${stamp}.json is in your Downloads folder.`);
}
function importFile(file){
  const r = new FileReader();
  r.onload = () => {
    try{ const n = JSON.parse(r.result);
      if(!n || n.v!==1 || !n.abil){ note("That file isn't a Dor sheet save","Pick a dor-sheet-….json file."); return; }
      S = fill(n); save(); renderAll(); note("Loaded save file", `${S.hp}/${S.hpMax} HP, level ${S.level}`);
    }catch(e){ note("Couldn't read that file","Pick a dor-sheet-….json file."); }
  };
  r.readAsText(file);
}
function renderAll(){
  document.body.classList.toggle("editing", editing);
  renderHeader(); renderVitals(); renderLevelUp(); renderAbilities(); renderSkills(); renderResources();
  renderCombat(); renderSpells(); renderFeatures(); renderGear(); renderProfs(); renderNotes(); renderCampaign(); renderStory(); renderRolls(); renderBackup();
}

/* ---------- actions ---------- */
function hpChange(kind){
  const v = parseInt(document.getElementById("hpAmt").value,10);
  if(!(v>0)){ note("Enter an amount first"); return; }
  if(kind==="dmg"){ let left=v; const t=Math.min(S.temp,left); S.temp-=t; left-=t; S.hp=Math.max(0,S.hp-left); note(`Took ${v} damage`, S.hp===0?"At 0 HP: make death saves.":`${S.hp} HP left`); }
  if(kind==="heal"){ S.hp=Math.min(S.hpMax,S.hp+v); if(S.hp>0) S.death={s:0,f:0}; note(`Healed ${v}`, `${S.hp} HP`); }
  if(kind==="temp"){ S.temp=Math.max(S.temp,v); note(`Temp HP ${S.temp}`,"Temp HP doesn't stack; you keep the higher."); }
  save(); renderVitals(); renderResources();
}
function togglePip(cur, i){ return i<cur ? i : i+1; } // tap filled-used boundary
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act],[data-roll],[data-adv],[data-prof]");
  if(!b) return;
  if(b.dataset.adv!==undefined){ adv=+b.dataset.adv; renderVitals(); return; }
  if(b.dataset.prof){ const k=b.dataset.prof, p=S.skillProf[k]||0;
    const max = S.level>=3?2:1; const np = p>=max?0:p+1;
    if(np) S.skillProf[k]=np; else delete S.skillProf[k];
    save(); renderSkills(); renderVitals(); return; }
  if(b.dataset.roll){ const [t,k]=b.dataset.roll.split(":");
    if(t==="init") return d20("Initiative", initBonus());
    if(t==="abil") return d20(ABIL.find(a=>a[0]===k)[1]+" check", M(k)+jack());
    if(t==="save") return d20(ABIL.find(a=>a[0]===k)[1]+" save", saveBonus(k));
    if(t==="skill"){ const s=SKILLS.find(x=>x[0]===k); return d20(s[1], skillBonus(k,s[2])); }
    if(t==="death"){ const r=d(20); adv=0;
      if(r===20){ S.hp=1; S.death={s:0,f:0}; show("Death save",r,"Natural 20: back up with 1 HP","crit"); }
      else if(r===1){ S.death.f=Math.min(3,S.death.f+2); show("Death save",r,"Natural 1: two failures","fumble"); }
      else if(r>=10){ S.death.s=Math.min(3,S.death.s+1); show("Death save",r,S.death.s===3?"Stable":"Success",""); }
      else { S.death.f=Math.min(3,S.death.f+1); show("Death save",r,S.death.f===3?"Three failures":"Failure",""); }
      save(); renderVitals(); renderResources(); return; }
    const i=+k;
    if(t==="atk"){ const a=S.attacks[i]; return d20(a.name+" attack", M(a.abil)+pb()); }
    if(t==="atkd"){ const a=S.attacks[i]; return dmg(a.name+" damage", a.die, M(a.abil), a.type, false); }
    if(t==="atkc"){ const a=S.attacks[i]; return dmg(a.name+" crit", a.die, M(a.abil), a.type, true); }
    if(t==="sdmg"){ const s=S.spells[i]; return dmg(s.name, cantripDice(s.dmg,s.lvl), 0, s.dtype, false); }
    if(t==="sheal"){ const s=S.spells[i]; return dmg(s.name+" heal", s.heal, M("cha"), "", false); }
    return; }
  const [a,arg,arg2] = b.dataset.act.split(":");
  if(a.startsWith("lu-") && luAction(a,arg,arg2)) return;
  if(a==="map"){ const v=document.getElementById("viewer"); document.getElementById("viewerImg").src=MAPS[arg]; v.hidden=false; v.querySelector("button").focus(); return; }
  if(a==="closemap"){ document.getElementById("viewer").hidden=true; return; }
  if(a==="vp"){ const v=S.vps[+arg]; v.n=Math.max(0,v.n+(+arg2)); save(); renderCampaign(); return; }
  if(a==="edit"){ editing=!editing; renderAll(); return; }
  if(a==="dmg"||a==="heal"||a==="temp") return hpChange(a);
  if(a==="insp"){ S.inspiration=!S.inspiration; save(); renderVitals(); return; }
  if(a==="spellatk") return d20("Spell attack", spellAtk());
  if(a==="long"){
    S.hp=S.hpMax; S.temp=0; S.slotsUsed={}; S.biUsed=0; S.freeDWUsed=false; S.death={s:0,f:0};
    S.hdUsed=Math.max(0,S.hdUsed-Math.max(1,Math.floor(S.level/2)));
    save(); renderAll(); note("Long rest done","HP, slots, Inspiration and the free Dissonant Whisper are back. Regained some hit dice."); return; }
  if(a==="short"){ if(S.level>=5) S.biUsed=0; save(); renderAll(); note("Short rest", "Spend hit dice in Resources. Song of Rest adds a die for anyone who does."); return; }
  if(a==="bi"){ S.biUsed=togglePip(S.biUsed,+b.dataset.i); S.biUsed=Math.min(biMax(),S.biUsed); save(); renderResources(); return; }
  if(a==="bigive"){ if(S.biUsed>=biMax()){ note("No Bardic Inspiration left","Recharges on a long rest."); return; } S.biUsed++; save(); renderResources(); note("Bardic Inspiration given",`They get a d${biDie()} for 10 minutes.`); return; }
  if(a==="biroll") return dmg("Bardic Inspiration","1d"+biDie(),0,"",false);
  if(a==="slot"){ const l=+arg, n=slotsFor(l); S.slotsUsed[l]=Math.min(n,togglePip(S.slotsUsed[l]||0,+b.dataset.i)); save(); renderResources(); renderSpells(); return; }
  if(a==="free"){ S.freeDWUsed=!S.freeDWUsed; save(); renderResources(); renderSpells(); return; }
  if(a==="hd"){ S.hdUsed=Math.min(S.level,togglePip(S.hdUsed,+b.dataset.i)); save(); renderResources(); return; }
  if(a==="spendhd"){ if(S.hdUsed>=S.level) return; S.hdUsed++; const r=d(8), h=Math.max(0,r+M("con")); S.hp=Math.min(S.hpMax,S.hp+h);
    show("Hit die", h, `d8 ${r} ${sgn(M("con"))} → ${S.hp} HP`, ""); renderVitals(); renderResources(); return; }
  if(a==="songrest") return dmg("Song of Rest","1d"+restDie(),0,"extra HP",false);
  if(a==="ds"){ S.death.s=togglePip(S.death.s,+b.dataset.i); save(); renderResources(); return; }
  if(a==="df"){ S.death.f=togglePip(S.death.f,+b.dataset.i); save(); renderResources(); return; }
  if(a==="cast"){ const s=S.spells[+arg], n=slotsFor(s.lvl), u=S.slotsUsed[s.lvl]||0;
    if(u>=n){ note(`No ${ORD[s.lvl]} slots left`, s.free&&!S.freeDWUsed?"You still have the free Dissonant Whisper.":"Recharge on a long rest."); return; }
    S.slotsUsed[s.lvl]=u+1; save(); renderResources(); renderSpells(); note(`Cast ${s.name}`, `${n-u-1} ${ORD[s.lvl]} slot${n-u-1===1?"":"s"} left${s.conc?" · Concentrating":""}`); return; }
  if(a==="castfree"){ S.freeDWUsed=true; save(); renderResources(); renderSpells(); note("Cast Dissonant Whisper (free)", `WIS save DC ${dc()}`); return; }
  if(a==="delspell"){ S.spells.splice(+arg,1); save(); renderAll(); return; }
  if(a==="addspell"){ const n=document.getElementById("nsName").value.trim(); if(!n) return;
    S.spells.push({name:n,lvl:Math.max(0,Math.min(5,+document.getElementById("nsLvl").value||0)),src:"Bard",cast:"",range:"",dur:"",desc:document.getElementById("nsDesc").value.trim()});
    save(); renderSpells(); return; }
  if(a==="addeq"){ const n=document.getElementById("newItem").value.trim(); if(!n) return; S.equipment.push({name:n,qty:1}); save(); renderGear(); return; }
  if(a==="deleq"){ S.equipment.splice(+arg,1); save(); renderGear(); return; }
  if(a==="export") return exportFile();
  if(a==="clearlog"){ S.log=[]; save(); renderRolls(); return; }
});
document.addEventListener("change", e=>{
  const t=e.target, ds=t.dataset;
  if(t.id==="importFile"){ if(t.files && t.files[0]) importFile(t.files[0]); t.value=""; return; }
  if(ds.abil){ S.abil[ds.abil]=Math.max(1,Math.min(30,parseInt(t.value,10)||10)); save(); renderAll(); return; }
  if(ds.f){ const numeric=["level","hpMax","ac"]; S[ds.f] = numeric.includes(ds.f) ? (parseInt(t.value,10)||S[ds.f]) : t.value;
    if(ds.f==="level") S.level=Math.max(1,Math.min(10,S.level));
    if(ds.f==="hpMax") S.hp=Math.min(S.hp,S.hpMax);
    save(); renderAll(); return; }
  if(ds.t){ S.text[ds.t]=t.value; save(); return; }
  if(ds.look){ S.look[ds.look]=t.value; save(); return; }
  if(ds.coin){ S.coins[ds.coin]=Math.max(0,parseInt(t.value,10)||0); save(); return; }
  if(ds.eq){ S.equipment[+ds.eq].qty=Math.max(0,parseInt(t.value,10)||0); save(); return; }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ document.getElementById("viewer").hidden=true; return; }
  if(e.key!=="Enter") return;
  if(e.target.id==="hpAmt"){ e.preventDefault(); hpChange("dmg"); }
  if(e.target.id==="newItem"){ e.preventDefault(); document.querySelector('[data-act="addeq"]').click(); }
});
renderAll();
</script>
</body>
</html>
